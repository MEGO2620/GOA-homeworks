                <h1>Giorgi XII</h1>
                <p></p><b>George XII</b> (<i>Georgian</i>: გიორგი XII, romanized: <u>Giorgi XII</u>; 10 November 1746 – 28 December 1800), contemporaneously known as George XIII,[a] of the Bagrationi dynasty, was the second and last king (mepe) of the Kingdom of Kartli-Kakheti in eastern Georgia from 1798 until his death in 1800.
